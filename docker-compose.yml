services:

  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nutri-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nutri-network

  # ──────────────────────────────────────────────
  # Backend Services
  # ──────────────────────────────────────────────

  idm-service:
    build:
      context: ./services/idm-service
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["src/index.js"]
    ports:
      - "5555:5555"
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nutri_idm?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-30}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
    volumes:
      - ./docker/entrypoint-idm.sh:/app/entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nutri-network

  menu-service:
    build:
      context: ./services/menu-service
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["src/index.js"]
    ports:
      - "5556:5556"
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nutri_menu?schema=public
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      STUDIO_PORT: 5556
    volumes:
      - ./docker/entrypoint.sh:/app/entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutri-network

  workout-service:
    build:
      context: ./services/workout-service
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["src/index.js"]
    ports:
      - "5557:5557"
    environment:
      PORT: 4003
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nutri_workout?schema=public
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      STUDIO_PORT: 5557
    volumes:
      - ./docker/entrypoint.sh:/app/entrypoint.sh
      - workout-uploads:/app/src/uploads/videos
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutri-network

  client-tracking-service:
    build:
      context: ./services/client-tracking-service
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["src/app.js"]
    ports:
      - "5558:5558"
    environment:
      PORT: 4004
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nutri_tracking?schema=public
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      MENU_SERVICE_URL: http://menu-service:4002
      STUDIO_PORT: 5558
    volumes:
      - ./docker/entrypoint.sh:/app/entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
      menu-service:
        condition: service_started
    networks:
      - nutri-network

  conversation-service:
    build:
      context: ./services/conversation-service
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["src/index.js"]
    ports:
      - "5559:5559"
    environment:
      PORT: 4006
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/nutri_conversation?schema=public
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      IDM_SERVICE_URL: http://idm-service:4001
      MCP_BASE_URL: http://mcp-service:4020
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_COACH_ID: ${TELEGRAM_COACH_ID}
      STUDIO_PORT: 5559
    volumes:
      - ./docker/entrypoint.sh:/app/entrypoint.sh
    depends_on:
      postgres:
        condition: service_healthy
      idm-service:
        condition: service_started
      mcp-service:
        condition: service_started
    networks:
      - nutri-network

  mcp-service:
    build:
      context: ./services/mcp-service
    restart: unless-stopped
    environment:
      PORT: 4020
      GATEWAY_BASE_URL: http://gateway-service:4000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_MODE: ${OPENAI_API_MODE:-responses}
      OPENAI_RESPONSES_STORE: ${OPENAI_RESPONSES_STORE:-true}
      REDIS_URL: redis://redis:6379
      CONVERSATION_STATE_BACKEND: redis
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nutri-network

  gateway-service:
    build:
      context: ./services/gateway-service
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      IDM_SERVICE_URL: http://idm-service:4001
      MENU_SERVICE_URL: http://menu-service:4002
      WORKOUT_SERVICE_URL: http://workout-service:4003
      TRACKING_SERVICE_URL: http://client-tracking-service:4004
      CONVERSATION_SERVICE_URL: http://conversation-service:4006
      MCP_SERVICE_URL: http://mcp-service:4020
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      PUBLIC_WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL}
    depends_on:
      idm-service:
        condition: service_started
      menu-service:
        condition: service_started
      workout-service:
        condition: service_started
      client-tracking-service:
        condition: service_started
    networks:
      - nutri-network

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "saas-proxy:80"]
    ports:
      - "4040:4040"
    depends_on:
      saas-proxy:
        condition: service_started
    networks:
      - nutri-network

  # ──────────────────────────────────────────────
  # Observability
  # ──────────────────────────────────────────────

  dozzle:
    image: amir20/dozzle:latest
    container_name: nutri-dozzle
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DOZZLE_BASE: /logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nutri-network

  # ──────────────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────────────

  saas-app:
    build:
      context: ./apps
      dockerfile: Saas-app/Dockerfile
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      EXPO_PUBLIC_API_URL: ${SAAS_PUBLIC_API_URL:-/}
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - nutri-network

  saas-proxy:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      DOZZLE_BASIC_AUTH_USERNAME: ${DOZZLE_BASIC_AUTH_USERNAME}
      DOZZLE_BASIC_AUTH_PASSWORD: ${DOZZLE_BASIC_AUTH_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        : "${DOZZLE_BASIC_AUTH_USERNAME:?DOZZLE_BASIC_AUTH_USERNAME is required}"
        : "${DOZZLE_BASIC_AUTH_PASSWORD:?DOZZLE_BASIC_AUTH_PASSWORD is required}"
        mkdir -p /etc/nginx/auth
        htpasswd -cbB /etc/nginx/auth/dozzle.htpasswd "$DOZZLE_BASIC_AUTH_USERNAME" "$DOZZLE_BASIC_AUTH_PASSWORD" >/dev/null
        exec nginx -g "daemon off;"
    volumes:
      - ./docker/nginx/saas-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/auth:/etc/nginx/auth
    depends_on:
      saas-app:
        condition: service_started
      gateway-service:
        condition: service_started
      dozzle:
        condition: service_started
    networks:
      - nutri-network

  client-app:
    build:
      context: ./apps
      dockerfile: client-app/Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:4000
    networks:
      - nutri-network

volumes:
  pgdata:
  redisdata:
  workout-uploads:

networks:
  nutri-network:
    driver: bridge
